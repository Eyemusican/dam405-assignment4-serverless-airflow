services:
  airflow:
    build:
      context: ./airflow
    image: dam405-airflow:3.3.2
    container_name: dam405-airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # Limit parallel task processes to save RAM (our DAG runs one task at a time)
      AIRFLOW__CORE__PARALLELISM: "4"
      # Format is username:role (user "admin" with the admin role), NOT a password.
      # The password is generated by Airflow at runtime and is not stored in this repo.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      # Pipeline settings as an Airflow Variable (read by the DAG, no hardcoding)
      AIRFLOW_VAR_ML_PIPELINE_CONFIG: >-
        {"data_dir": "/opt/airflow/data",
         "model_dir": "/opt/airflow/lambda_fn/model",
         "min_rows": 500,
         "min_recall": 0.9}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./lambda_fn/model:/opt/airflow/lambda_fn/model